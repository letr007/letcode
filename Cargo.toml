[package]
name = "letcode"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-openai = { version = "0.38", features = ["_api", "byot", "response-types", "responses", "chat-completion"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-langfuse = "0.6.1"
dotenvy = "0.15"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.1"
unicode-segmentation = "1"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
httpdate = "1"
arboard = "3.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
