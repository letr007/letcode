name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            command: cargo build --release --locked --target x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            command: cargo check --release --locked --target aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            command: cargo check --release --locked --target x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            command: cargo check --release --locked --target aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            command: cargo check --release --locked --target x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            command: cargo check --release --locked --target aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.target }}
          shared-key: letcode

      - name: Compile release
        run: ${{ matrix.command }}
